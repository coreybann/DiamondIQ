
name: Update MLB Contract Options

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-option-statuses
  cancel-in-progress: false

jobs:
  update-options:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update confirmed option decisions
        run: python3 scripts/update-option-statuses.py --write

      - name: Commit verified status changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/free-agent-status-2027.json

          if git diff --cached --quiet; then
            echo "No new verified decisions."
            exit 0
          fi

          git commit -m "Update verified MLB contract option statuses"
          git push
