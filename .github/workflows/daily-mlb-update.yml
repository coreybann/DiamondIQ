name: Daily MLB Stats Update

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger DiamondIQ stats refresh
        env:
          REFRESH_URL: ${{ secrets.DIAMONDIQ_REFRESH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST \
            --url "$REFRESH_URL" \
            --header "Authorization: Bearer $CRON_SECRET"